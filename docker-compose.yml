services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simplechat-backend
    env_file:
      - .env
    environment:
      SIMPLECHAT_DB_PATH: /app/data/simplechat.db
      CHAT_UPLOAD_ROOT: /app/data/chat_uploads
      RAG_UPLOAD_ROOT: /app/data/rag_files
    volumes:
      - simplechat_data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_UPLOAD_BASE_URL: /chat_uploads
    container_name: simplechat-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  simplechat_data:
